<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <h1>✨My personal website✨</h1>
      <img src="photo.jpg" class="profile" />
      <h2>FEYSEL YASSIN</h2>
      <p>
        I'm Second year student in School of Electrical Engineeering.I'm
        interested in coding and developing and I want to be what I want.
      </p>
      <form onsubmit="Submit(event)">
        <div class="input-group">
          <label for="name">Your Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your Name"
            required
          />
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Your Email"
          />
        </div>
        <div class="input-group">
          <textarea
            class="comment"
            rows="3"
            name="comment"
            id=""
            placeholder="Your comment here"
          ></textarea>
        </div>
        <button type="submit">Send</button>
      </form>

      <footer>© 2025 Feysel Yassin All rights reserved.</footer>
    </div>

    <script>
      function Submit(event) {
        alert("You've successfully submitted the form! Thank you.");
        event.target.reset();
      }
    </script>
  </body>
</html>
