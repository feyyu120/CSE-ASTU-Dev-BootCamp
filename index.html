<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Website</title>
  </head>
  <body>
    <div class="box">
      <h1>✨My first personal website✨</h1>
      <img src="photo.jpg" class="profile" />
      <h2>FEYSEL YASSIN</h2>
      <p>
        I'm Second year student in School of Electrical Engineeering.I'm
        interested in coding and developing and I want to be what I want.
      </p>
      <form onsubmit="Submit(event)">
        <div class="input-group">
          <label for="name">Your Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your Name"
            required
          />
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Your Email"
          />
        </div>
        <div class="input-group">
          <textarea
            class="comment"
            rows="3"
            name="comment"
            id=""
            placeholder="Your comment here"
          ></textarea>
        </div>
        <button type="submit">Send</button>
      </form>

      <footer>© 2025 Feysel Yassin All rights reserved.</footer>
    </div>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, rgb(46, 46, 115), rgb(98, 44, 192));
      }

      .box {
        background: rgba(255, 255, 255, 0.95);
        width: 100%;
        height: 90%;
        max-width: 1024px;
        padding: 0 36px;

        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(211, 81, 81, 0.25);
        text-align: center;
      }

      .profile {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #667eea;
        margin-bottom: 5px;
      }
      h1 {
        margin-top: 5px;
        color: #151414;
        margin-bottom: 5px;
      }

      h2 {
        margin-top: 5px;
        margin-bottom: 5px;
        color: #100f0f;
      }

      p {
        margin: 0 0 20px;
        color: #141010;
        font-size: 16px;
      }

      form {
        text-align: left;
      }

      .input-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-size: 17px;
        color: #555;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 14px;
        transition: 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
      }
      .comment {
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 14px;
        outline: none;
        width: 100%;
        padding: 20px;
      }

      button {
        width: 20%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        margin-top: 6px;
        margin-left: 360px;
      }
      button:hover {
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-radius: 20px;
        border: none;
        transform: translateY(-2px);
      }

      footer {
        margin-top: 36px;
        font-size: 17px;
        color: #999;
        text-align: center;
      }
    </style>
    <script>
      function Submit(event) {
        alert("You've successfully submitted the form! Thank you.");
        event.target.reset();
      }
    </script>
  </body>
</html>
